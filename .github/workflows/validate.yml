name: Validate GymFit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

  backend:
    name: API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Start API and check health endpoint
        shell: bash
        run: |
          npm start > /tmp/gymfit-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gymfit-api.log
          exit 1
